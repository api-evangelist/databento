    Reference and non-price data that complements the market data feeds - a security master (instrument
    definitions and identifiers), corporate actions (splits, dividends, symbol changes, and other events),
    and adjustment factors for building back-adjusted price series. Served over the same REST HTTP surface
    as the historical API.
