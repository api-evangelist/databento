          title: End
        symbols:
          type: string
          title: Symbols
          default: ALL_SYMBOLS
        schema_:
          type: string
          title: Schema
          default: trades
        stype_in:
          type: string
          title: Stype In
          default: raw_symbol
        mode:
          type: string
          title: Mode
          default: historical-streaming
        limit:
          anyOf:
