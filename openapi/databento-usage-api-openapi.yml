components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MonthToDateUsage:
      properties:
        usage_bytes:
          type: integer
          title: Usage Bytes
        usage_cents:
          type: integer
          title: Usage Cents
      type: object
      required:
      - usage_bytes
      - usage_cents
      title: MonthToDateUsage
    LiveConnectionRecord:
      properties:
        established_timestamp:
          type: integer
          title: Established Timestamp
        request_id:
          type: string
          title: Request Id
        user_id:
          type: string
          title: User Id
        session_id:
          type: string
          title: Session Id
        api_key:
          type: string
          title: Api Key
        user_name:
          type: string
          title: User Name
        gateway:
          type: string
          title: Gateway
        dataset:
          type: string
          title: Dataset
        schema:
          type: string
          title: Schema
      type: object
      required:
      - established_timestamp
      - request_id
      - user_id
      - session_id
      - api_key
      - user_name
      - gateway
      - dataset
      - schema
      title: LiveConnectionRecord
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DataUsageRecord:
      properties:
        timestamp:
          type: integer
          title: Timestamp
        user_id:
          type: string
          title: User Id
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
        user_name:
          type: string
          title: User Name
        dataset:
          type: string
          title: Dataset
        schema:
          type: string
          title: Schema
        mode:
          type: string
          title: Mode
        usage_sum:
          type: integer
          title: Usage Sum
        cost_sum:
          type: number
          title: Cost Sum
      type: object
      required:
      - timestamp
      - user_id
      - api_key
      - user_name
      - dataset
      - schema
      - mode
      - usage_sum
      - cost_sum
      title: DataUsageRecord
  securitySchemes:
    OAuth2PasswordBearerWithCookie:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /v0/auth/login
    HTTPBasic:
      type: http
      scheme: basic
